<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HasanAI - Chat</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0e639c">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg-primary: #1e1e1e;
            --bg-secondary: #252526;
            --bg-tertiary: #2d2d30;
            --bg-quaternary: #3e3e42;
            --text-primary: #d4d4d4;
            --text-secondary: #858585;
            --accent: #0e639c;
            --accent-hover: #1177bb;
            --border: #3e3e42;
            --error: #f48771;
            --user-bubble: #0e639c;
            --assistant-bubble: #3e3e42;
            --shadow: rgba(0, 0, 0, 0.3);
            --chat-font-size: 15px;
        }

        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-tertiary: #e8e8e8;
            --bg-quaternary: #d4d4d4;
            --text-primary: #1e1e1e;
            --text-secondary: #666666;
            --accent: #0e639c;
            --accent-hover: #1177bb;
            --border: #cccccc;
            --error: #d32f2f;
            --user-bubble: #0e639c;
            --assistant-bubble: #e8e8e8;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        .font-size-small {
            --chat-font-size: 13px;
        }

        .font-size-medium {
            --chat-font-size: 15px;
        }

        .font-size-large {
            --chat-font-size: 17px;
        }

        .font-size-xlarge {
            --chat-font-size: 19px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        .sidebar {
            width: 280px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.3s ease, background-color 0.3s ease;
            z-index: 100;
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
            position: absolute;
            height: 100%;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-header h2 {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .new-chat-button {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .new-chat-button:hover {
            background-color: var(--accent-hover);
        }

        .sidebar-search {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-search input {
            width: 100%;
            background-color: var(--bg-quaternary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }

        .sidebar-search input:focus {
            border-color: var(--accent);
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .conversation-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            transition: background-color 0.2s;
            position: relative;
            group: true;
        }

        .conversation-item:hover {
            background-color: var(--bg-quaternary);
        }

        .conversation-item.active {
            background-color: var(--bg-quaternary);
            border-left: 3px solid var(--accent);
        }

        .conversation-item.pinned {
            border-left: 3px solid var(--accent);
        }

        .conversation-info {
            flex: 1;
            min-width: 0;
        }

        .conversation-title {
            font-size: 13px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-meta {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .conversation-actions {
            display: none;
            gap: 4px;
        }

        .conversation-item:hover .conversation-actions {
            display: flex;
        }

        .conversation-action-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            font-size: 12px;
            transition: all 0.2s;
        }

        .conversation-action-btn:hover {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }

        .sidebar-toggle {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 101;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            display: none;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            transition: margin-left 0.3s ease;
        }

        .chat-header {
            padding: 12px 20px;
            background-color: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            gap: 12px;
            flex-wrap: wrap;
            transition: background-color 0.3s ease;
        }

        .chat-header h1 {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .theme-select {
            background-color: var(--bg-quaternary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            outline: none;
        }

        .theme-select:focus {
            border-color: var(--accent);
        }

        .model-select {
            background-color: var(--bg-quaternary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            min-width: 180px;
        }

        .model-select:focus {
            border-color: var(--accent);
        }

        .voice-select {
            background-color: var(--bg-quaternary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            min-width: 180px;
        }

        .voice-select:focus {
            border-color: var(--accent);
        }

        .voice-select option.british-voice {
            color: var(--accent);
            font-weight: bold;
        }

        .icon-button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .icon-button:hover {
            background-color: var(--bg-quaternary);
            border-color: var(--accent);
        }

        .icon-button:active {
            transform: scale(0.96);
            opacity: 0.8;
        }

        #fontSizeButton {
            font-weight: bold;
            min-width: 32px;
            text-align: center;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: auto;
        }

        @media (max-width: 768px) {
            #fontSizeButton {
                min-width: 44px;
                min-height: 44px;
                padding: 12px 14px;
                font-size: 15px;
                touch-action: manipulation;
                user-select: none;
                -webkit-user-select: none;
                pointer-events: auto;
                position: relative;
                z-index: 1;
            }

            #fontSizeButton:active {
                opacity: 0.7;
                transform: scale(0.96);
            }
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
            font-size: var(--chat-font-size);
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
            animation: fadeIn 0.3s ease-in;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-bubble);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background-color: var(--assistant-bubble);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            order: 2;
        }

        .message.assistant .message-avatar {
            background-color: var(--accent);
            color: #ffffff;
            order: 0;
        }

        .message-content-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .message.user .message-content-wrapper {
            flex-direction: row-reverse;
        }

        .message-body {
            flex: 1;
            min-width: 0;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            font-size: 11px;
            opacity: 0.7;
        }

        .message.user .message-header {
            color: #ffffff;
        }

        .message.assistant .message-header {
            color: var(--text-primary);
        }

        .message-time {
            font-size: 10px;
            opacity: 0.6;
        }

        .message-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            font-size: 10px;
            opacity: 0.6;
        }

        .message pre {
            background-color: var(--bg-primary);
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin-top: 8px;
            position: relative;
            border: 1px solid var(--border);
        }

        .message code {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .message p {
            margin-bottom: 8px;
        }

        .message p:last-child {
            margin-bottom: 0;
        }

        .message ul, .message ol {
            margin-left: 20px;
            margin-bottom: 8px;
        }

        .message li {
            margin-bottom: 4px;
        }

        .message strong {
            font-weight: 600;
        }

        .message em {
            font-style: italic;
        }

        .message-image {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            border: 1px solid var(--border);
        }

        .copy-button {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: var(--bg-quaternary);
            border: none;
            color: var(--text-primary);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message pre:hover .copy-button {
            opacity: 1;
        }

        .copy-button:hover {
            background-color: var(--accent);
            color: #ffffff;
        }

        .message-actions {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message:hover .message-actions {
            opacity: 1;
        }

        .message-action-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }

        .message-action-btn:hover {
            background-color: var(--bg-quaternary);
            color: var(--text-primary);
        }

        .message-action-btn.active {
            background-color: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 12px 16px;
            background-color: var(--assistant-bubble);
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            color: var(--text-secondary);
            font-style: italic;
            margin-left: 42px;
            margin-bottom: 8px;
        }

        .typing-indicator.active {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .loading-skeleton {
            display: flex;
            gap: 8px;
            padding: 8px 0;
        }

        .loading-skeleton .skeleton-line {
            height: 12px;
            background: linear-gradient(90deg, var(--bg-quaternary) 25%, var(--border) 50%, var(--bg-quaternary) 75%);
            background-size: 200% 100%;
            animation: skeleton-pulse 1.5s ease-in-out infinite;
            border-radius: 4px;
            flex: 1;
        }

        .loading-skeleton .skeleton-line:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-skeleton .skeleton-line:nth-child(3) {
            animation-delay: 0.4s;
            max-width: 60%;
        }

        @keyframes skeleton-pulse {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .chat-input-container {
            padding: 12px 20px;
            background-color: var(--bg-tertiary);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            align-items: flex-end;
            flex-shrink: 0;
            transition: background-color 0.3s ease;
        }

        .chat-input {
            flex: 1;
            background-color: var(--bg-quaternary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 120px;
            line-height: 1.5;
        }

        .chat-input:focus {
            border-color: var(--accent);
        }

        .chat-input::placeholder {
            color: var(--text-secondary);
        }

        .send-button {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            white-space: nowrap;
        }

        .send-button:hover:not(:disabled) {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .send-button:active:not(:disabled) {
            background-color: var(--accent);
            transform: translateY(0);
        }

        .send-button:disabled {
            background-color: var(--bg-quaternary);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .stop-button {
            background-color: var(--error);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            white-space: nowrap;
            display: none;
        }

        .stop-button.visible {
            display: block;
        }

        .stop-button:hover {
            opacity: 0.9;
        }

        .voice-button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .voice-button:hover {
            background-color: var(--bg-quaternary);
            border-color: var(--accent);
        }

        .voice-button.recording {
            background-color: var(--error);
            border-color: var(--error);
            color: #ffffff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .image-preview-container {
            padding: 12px 20px;
            background-color: var(--bg-tertiary);
            border-top: 1px solid var(--border);
            display: none;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
        }

        .image-preview-container.active {
            display: flex;
        }

        .image-preview {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--accent);
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-preview .remove-image {
            position: absolute;
            top: 2px;
            right: 2px;
            background-color: rgba(0, 0, 0, 0.7);
            border: none;
            color: #ffffff;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-preview-info {
            flex: 1;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .ocr-status {
            font-size: 10px;
            color: var(--accent);
            margin-top: 2px;
            display: none;
        }

        .ocr-status.active {
            display: block;
        }

        .ocr-status.error {
            color: var(--error);
        }

        .ocr-text {
            font-size: 10px;
            color: var(--text-primary);
            margin-top: 2px;
            display: none;
            max-height: 60px;
            overflow-y: auto;
            background: var(--bg-primary);
            padding: 4px;
            border-radius: 4px;
            border: 1px solid var(--border);
            word-break: break-word;
        }

        .ocr-text.active {
            display: block;
        }

        .typing-indicator.sending {
            display: flex;
        }

        .attach-button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .attach-button:hover {
            background-color: var(--bg-quaternary);
            border-color: var(--accent);
        }

        .camera-button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .camera-button:hover {
            background-color: var(--bg-quaternary);
            border-color: var(--accent);
        }

        #imageInput, #cameraInput {
            display: none;
        }

        .usage-info {
            padding: 8px 20px;
            background-color: var(--bg-tertiary);
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-secondary);
            display: none;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .usage-info.active {
            display: flex;
        }

        .input-info {
            padding: 4px 20px;
            background-color: var(--bg-tertiary);
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-secondary);
            display: none;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .input-info.active {
            display: flex;
        }

        .preview-toggle {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }

        .preview-toggle:hover {
            background-color: var(--bg-quaternary);
            color: var(--text-primary);
        }

        .preview-toggle.active {
            background-color: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-quaternary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        @media (max-width: 768px) {
            :root {
                --safe-bottom: env(safe-area-inset-bottom, 0px);
            }

</head>
<body>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">

                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const stopButton = document.getElementById('stopButton');
        const typingIndicator = document.getElementById('typingIndicator');
        const clearChatButton = document.getElementById('clearChat');
        const attachButton = document.getElementById('attachButton');
        const cameraButton = document.getElementById('cameraButton');
        const voiceButton = document.getElementById('voiceButton');
        const voiceOutputToggle = document.getElementById('voiceOutputToggle');
        const imageInput = document.getElementById('imageInput');
        const cameraInput = document.getElementById('cameraInput');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const previewImg = document.getElementById('previewImg');
        const imageName = document.getElementById('imageName');
        const removeImageButton = document.getElementById('removeImage');
        const modelSelect = document.getElementById('modelSelect');
        const ocrStatus = document.getElementById('ocrStatus');
        const ocrText = document.getElementById('ocrText');
        const voiceSelect = document.getElementById('voiceSelect');
        const speedSelect = document.getElementById('speedSelect');
        const exportJsonButton = document.getElementById('exportJson');
        const exportMarkdownButton = document.getElementById('exportMarkdown');
        const shareChatButton = document.getElementById('shareChat');
        const fontSizeButton = document.getElementById('fontSizeButton');
        const usageInfo = document.getElementById('usageInfo');
        const usageText = document.getElementById('usageText');
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebarBackdrop = document.getElementById('sidebarBackdrop');
        const newChatButton = document.getElementById('newChatButton');
        const conversationsList = document.getElementById('conversationsList');
        const conversationSearch = document.getElementById('conversationSearch');
        const themeSelect = document.getElementById('themeSelect');
        const inputInfo = document.getElementById('inputInfo');
        const charCount = document.getElementById('charCount');
        const previewToggle = document.getElementById('previewToggle');
        const importButton = document.getElementById('importButton');
        const importModal = document.getElementById('importModal');
        const closeImportModal = document.getElementById('closeImportModal');
        const importArea = document.getElementById('importArea');
        const importFileInput = document.getElementById('importFileInput');
        const settingsButton = document.getElementById('settingsButton');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettingsModal = document.getElementById('closeSettingsModal');
        const saveSettingsButton = document.getElementById('saveSettings');
        const resetSettingsButton = document.getElementById('resetSettings');
        const settingApiUrl = document.getElementById('settingApiUrl');
        const settingApiKey = document.getElementById('settingApiKey');
        const settingModel = document.getElementById('settingModel');
        const settingAccent = document.getElementById('settingAccent');
        const settingFontSize = document.getElementById('settingFontSize');

        let conversations = [];
        let currentConversationId = null;
        let conversationHistory = [];
        let isStreaming = false;
        let abortController = null;
        let selectedImage = null;
        let selectedImageMime = 'image/jpeg';
        let recognition = null;
        let isRecording = false;
        let speechSynth = null;
        let voicesLoaded = false;
        let voicesLoadPromise = null;
        let currentUtterance = null;
        let autoReadEnabled = false;
        let userInteracted = false;
        let selectedVoiceIndex = '';
        let showPreview = false;

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function saveConversations() {
            localStorage.setItem('hasanai_conversations', JSON.stringify(conversations));
        }

        function loadConversations() {
            const saved = localStorage.getItem('hasanai_conversations');
            if (saved) {
                try {
                    conversations = JSON.parse(saved);
                } catch (e) {
                    conversations = [];
                }
            }
        }

        function getCurrentConversation() {
            return conversations.find(c => c.id === currentConversationId);
        }

        function createNewConversation() {
            const conversation = {
                id: generateId(),
                title: 'New Chat',
                messages: [],
                pinned: false,
                createdAt: Date.now(),
                updatedAt: Date.now()
            };
            conversations.unshift(conversation);
            saveConversations();
            return conversation;
        }

        function switchConversation(id) {
            if (isStreaming) return;
            currentConversationId = id;
            const conversation = getCurrentConversation();
            conversationHistory = conversation ? [...conversation.messages] : [];
            renderConversationsList();
            renderMessages();
            updateWelcomeTime();
        }

        function deleteConversation(id) {
            conversations = conversations.filter(c => c.id !== id);
            if (currentConversationId === id) {
                currentConversationId = null;
                conversationHistory = [];
                renderMessages();
            }
            saveConversations();
            renderConversationsList();
        }

        function renameConversation(id, newTitle) {
            const conversation = conversations.find(c => c.id === id);
            if (conversation) {
                conversation.title = newTitle || 'Untitled Chat';
                conversation.updatedAt = Date.now();
                saveConversations();
                renderConversationsList();
            }
        }

        function togglePinConversation(id) {
            const conversation = conversations.find(c => c.id === id);
            if (conversation) {
                conversation.pinned = !conversation.pinned;
                saveConversations();
                renderConversationsList();
            }
        }

        function renderConversationsList() {
            const searchTerm = conversationSearch.value.toLowerCase();
            const filtered = conversations.filter(c => 
                c.title.toLowerCase().includes(searchTerm)
            );

            const pinned = filtered.filter(c => c.pinned);
            const unpinned = filtered.filter(c => !c.pinned);

            conversationsList.innerHTML = '';

            if (pinned.length === 0 && unpinned.length === 0) {
                conversationsList.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-secondary); font-size: 13px;">No conversations yet</div>';
                return;
            }

            pinned.forEach(conv => {
                conversationsList.appendChild(createConversationElement(conv));
            });

            unpinned.forEach(conv => {
                conversationsList.appendChild(createConversationElement(conv));
            });
        }

        function createConversationElement(conversation) {
            const div = document.createElement('div');
            div.className = `conversation-item ${conversation.id === currentConversationId ? 'active' : ''} ${conversation.pinned ? 'pinned' : ''}`;
            
            const date = new Date(conversation.updatedAt);
            const timeStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

            div.innerHTML = `
                <div class="conversation-info">
                    <div class="conversation-title">${escapeHtml(conversation.title)}</div>
                    <div class="conversation-meta">${timeStr}</div>
                </div>
                <div class="conversation-actions">
                    <button class="conversation-action-btn" title="Rename" data-action="rename">✏️</button>
                    <button class="conversation-action-btn" title="Pin/Unpin" data-action="pin">${conversation.pinned ? '📌' : '📍'}</button>
                    <button class="conversation-action-btn" title="Delete" data-action="delete">🗑️</button>
                </div>
            `;

            div.addEventListener('click', (e) => {
                if (!e.target.classList.contains('conversation-action-btn')) {
                    switchConversation(conversation.id);
                }
            });

            div.querySelectorAll('.conversation-action-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const action = btn.dataset.action;

                        togglePinConversation(conversation.id);

                        if (confirm('Delete this conversation?')) {

                        }
                    }
                });
            });

        async function runOCR(imageBase64) {
            if (!imageBase64) return null;
            if (typeof Tesseract === 'undefined') {
                console.warn('Tesseract.js not loaded');
                return null;
            }
            try {
                ocrStatus.classList.add('active');
                ocrText.classList.remove('active');
                ocrText.textContent = '';
                ocrStatus.textContent = 'Reading image text...';
                const result = await Tesseract.recognize(
                    `data:${selectedImageMime};base64,${imageBase64}`,
                    'eng',
                    {
                        logger: (m) => {
                            if (m.status === 'recognizing text') {
                                const pct = Math.round((m.progress || 0) * 100);
                                ocrStatus.textContent = `Reading image text... ${pct}%`;
                            } else {
                                ocrStatus.textContent = m.status || 'Reading image...';
                            }
                        }
                    }
                );
                const text = (result && result.data && result.data.text || '').trim();
                ocrStatus.textContent = text ? 'Text extracted' : 'No text found';
                ocrStatus.classList.toggle('error', !text);
                if (text) {
                    ocrText.textContent = text;
                    ocrText.classList.add('active');
                }
                return text;
            } catch (e) {
                console.error('OCR failed:', e);
                ocrStatus.textContent = 'Text read failed';
                ocrStatus.classList.add('error');
                return null;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function extractTextFromHtml(html) {
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }

        function formatMessage(text) {
            let formatted = escapeHtml(text);
            formatted = formatted.replace(/&gt;\n/g, '&gt;\n');
            formatted = formatted.replace(/```(\w+)?\n?([\s\S]*?)```/g, (match, lang, code) => {
                const escapedCode = code.trim().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return `<pre><code>${escapedCode}</code><button class="copy-button">Copy</button></pre>`;
            });
            formatted = formatted.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            formatted = formatted.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            formatted = formatted.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            formatted = formatted.replace(/^# (.+)$/gm, '<h1>$1</h1>');
            formatted = formatted.replace(/^\s*[-*] (.+)$/gm, '<li>$1</li>');
            formatted = formatted.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
            formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
            formatted = formatted.replace(/\n/g, '<br>');
            return formatted;
        }

        function appendMessage(role, content, time = null, imageBase64 = null, imageMime = null, meta = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            const currentTime = time || getCurrentTime();
            const roleName = role === 'user' ? 'You' : 'HasanAI';
            const avatarLetter = role === 'user' ? 'U' : 'H';
            let contentHtml = '';
            if (imageBase64) {
                const mime = imageMime || 'image/jpeg';
                contentHtml += `<img src="data:${mime};base64,${imageBase64}" class="message-image" alt="Uploaded image"><br>`;
            }
            if (content) {
                contentHtml += formatMessage(content);
            }
            let metaHtml = '';
            if (meta) {
                metaHtml = `<div class="message-meta"><span>${escapeHtml(meta)}</span></div>`;
            }
            messageDiv.innerHTML = `
                <div class="message-content-wrapper">
                    <div class="message-avatar">${avatarLetter}</div>
                    <div class="message-body">
                        <div class="message-header">
                            <span>${roleName}</span>
                            <span class="message-time">${currentTime}</span>
                        </div>
                        <div class="message-content">${contentHtml}</div>
                        ${metaHtml}
                        <div class="message-actions">
                            ${role === 'assistant' ? '<button class="message-action-btn" data-action="speak">🔊 Listen</button>' : ''}

        function setupMessageActions(messageDiv) {
            const actions = messageDiv.querySelectorAll('.message-action-btn');
            actions.forEach(btn => {
                btn.addEventListener('click', () => {
                    const action = btn.dataset.action;
                    if (action === 'speak') {
                        const contentDiv = messageDiv.querySelector('.message-content');
                        const text = extractTextFromHtml(contentDiv.innerHTML);
                        if (speechSynth && speechSynth.speaking) {
                            speechSynth.cancel();
                            btn.classList.remove('active');
                        } else {
                            speakText(text, btn);
                        }
                    } else if (action === 'edit') {
                        editUserMessage(messageDiv);
                    } else if (action === 'retry') {
                        retryLastMessage();
                    }
                });

        }

        function editUserMessage(messageDiv) {
            const contentDiv = messageDiv.querySelector('.message-content');
            const currentText = extractTextFromHtml(contentDiv.innerHTML).replace(/<img[^>]*>/g, '').trim();
            
            const input = document.createElement('textarea');
            input.className = 'edit-input';
            input.value = currentText;
            input.rows = 3;
            
            contentDiv.innerHTML = '';
            contentDiv.appendChild(input);
            input.focus();
            
            const saveEdit = () => {
                const newText = input.value.trim();
                if (newText) {
                    const time = messageDiv.querySelector('.message-time').textContent;
                    const img = messageDiv.querySelector('.message-image');
                    const imageBase64 = img ? img.src.replace(/^data:[^;]+;base64,/, '') : null;
                    const imageMime = img ? img.src.match(/^data:([^;]+);/)?.[1] : null;
                    
                    messageDiv.remove();
                    
                    const conv = getCurrentConversation();
                    if (conv && conv.messages.length > 0) {
                        const lastUserMsg = conv.messages.filter(m => m.role === 'user').pop();
                        if (lastUserMsg) {
                            const idx = conv.messages.indexOf(lastUserMsg);
                            if (idx !== -1) {
                                conv.messages[idx].content = newText;
                                if (imageBase64) {
                                    conv.messages[idx].imageBase64 = imageBase64;
                                    conv.messages[idx].imageMime = imageMime;
                                }
                            }
                        }
                    }
                    
                    conversationHistory = conv ? [...conv.messages] : [];
                    appendMessage('user', newText, time, imageBase64, imageMime);
                    retryLastMessage();
                } else {
                    contentDiv.innerHTML = formatMessage(currentText);
                }
            };
            
            input.addEventListener('blur', saveEdit);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    saveEdit();
                }
            });
        }

        function retryLastMessage() {
            if (isStreaming) return;
            const conv = getCurrentConversation();
            if (!conv || conv.messages.length === 0) return;
            
            const lastAssistantIdx = conv.messages.map((m, i) => m.role === 'assistant' ? i : -1).filter(i => i !== -1).pop();
            if (lastAssistantIdx !== undefined) {
                conv.messages = conv.messages.slice(0, lastAssistantIdx);
                conversationHistory = [...conv.messages];
            }
            
            const messages = chatMessages.querySelectorAll('.message');
            messages.forEach(msg => {
                const isAssistant = msg.classList.contains('assistant');
                const isLast = msg === messages[messages.length - 1];
                if (isAssistant && isLast) {
                    msg.remove();
                }
            });
            
            const lastUserMsg = conv.messages.filter(m => m.role === 'user').pop();
            if (lastUserMsg && lastUserMsg.content) {
                sendMessageToAPI(lastUserMsg.content, lastUserMsg.imageBase64, lastUserMsg.imageMime);
            }
        }

        function exportConversation(format) {
            const conv = getCurrentConversation();
            if (!conv || conv.messages.length === 0) {
                alert('No conversation to export');
                return;
            }
            let content, filename, type;
            if (format === 'json') {
                content = JSON.stringify(conv.messages, null, 2);
                filename = `${conv.title.replace(/[^a-z0-9]/gi, '_')}.json`;
                type = 'application/json';
            } else if (format === 'pdf') {
                window.print();
                return;
            } else {
                content = '# HasanAI Chat Export\n\n';
                content += `Title: ${conv.title}\n`;
                content += `Exported: ${new Date().toLocaleString()}\n\n`;
                conv.messages.forEach((msg, index) => {
                    const role = msg.role === 'user' ? 'You' : 'HasanAI';
                    content += `## ${role} (${index + 1})\n\n`;
                    if (typeof msg.content === 'string') {
                        content += `${msg.content}\n\n`;
                    } else {
                        msg.content.forEach(item => {
                            if (item.type === 'text') {
                                content += `${item.text}\n\n`;
                            } else if (item.type === 'image_url') {
                                content += '[Image]\n\n';
                            }
                        });
                    }
                });
                filename = `${conv.title.replace(/[^a-z0-9]/gi, '_')}.md`;
                type = 'text/markdown';
            }
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function initSpeechSynthesis() {

                    resolve(voices);

        async function speakText(text, buttonElement) {
            if (!speechSynth) {
                console.warn('Speech synthesis not supported');
                return;
            }
            try {
                await voicesLoadPromise;
            } catch (e) {
                console.warn('Voice loading failed', e);
            }
            if (!voicesLoaded) {
                console.warn('Voices not loaded yet');
                if (buttonElement) buttonElement.classList.remove('active');
                return;
            }
            if (speechSynth.speaking) {
                speechSynth.cancel();
                if (buttonElement) buttonElement.classList.remove('active');
                await new Promise(resolve => setTimeout(resolve, 150));
            }
            const cleanText = extractTextFromHtml(text).trim();
            if (!cleanText) return;
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-US';
            utterance.rate = parseFloat(speedSelect.value) || 1;
            utterance.pitch = 1;
            utterance.volume = 1;
            const voices = speechSynth.getVoices();
            const selectedIndex = voiceSelect.value;
            if (selectedIndex !== '' && voices[selectedIndex]) {
                utterance.voice = voices[selectedIndex];
            } else {
                const enVoices = voices.filter(voice => voice.lang.startsWith('en'));
                if (enVoices.length > 0) {
                    const preferredVoice = enVoices.find(voice => 
                        voice.lang.toLowerCase().includes('gb') || 
                        voice.lang.toLowerCase().includes('uk') ||
                        voice.name.toLowerCase().includes('british')
                    ) || enVoices[0];
                    utterance.voice = preferredVoice;
                }
            }
            utterance.onstart = () => {
                console.log('Speech started');
                if (buttonElement) buttonElement.classList.add('active');
            };
            utterance.onend = () => {
                console.log('Speech ended');
                if (buttonElement) buttonElement.classList.remove('active');
                currentUtterance = null;
            };
            utterance.onerror = (event) => {
                console.error('Speech error:', event.error);
                if (buttonElement) buttonElement.classList.remove('active');
                currentUtterance = null;
            };
            try {
                speechSynth.speak(utterance);
                console.log('Speech triggered successfully');
            } catch (e) {
                console.error('Failed to start speech:', e);
            }
        }

        async function sendMessageToAPI(content, imageBase64 = null, imageMime = null) {
            const userMessage = { role: 'user', content: [] };

            if (imageBase64) {
                userMessage.content.push({
                    type: 'image_url',
                    image_url: {
                        url: `data:${imageMime};base64,${imageBase64}`
                    }
                });
            }

            if (content) {
                userMessage.content.push({
                    type: 'text',
                    text: content
                });
            }

            if (userMessage.content.length === 1 && userMessage.content[0].type === 'text') {
                userMessage.content = userMessage.content[0].text;
            }

            const conv = getCurrentConversation();
            if (conv) {
                conv.messages.push(userMessage);
                if (conv.messages.length === 1) {
                    conv.title = autoGenerateTitle(content);
                }
                conv.updatedAt = Date.now();
                saveConversations();
                renderConversationsList();
            }

            conversationHistory.push(userMessage);
            appendMessage('user', content, null, imageBase64, imageMime);

            const assistantMessageDiv = appendMessage('assistant', '', null);
            const contentDiv = assistantMessageDiv.querySelector('.message-content');
            typingIndicator.classList.add('active');
            scrollToBottom();

            abortController = new AbortController();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        messages: [
                            { role: 'system', content: 'You are Hasan, a friendly AI assistant. Never mention Mercury, InceptionLabs, or any other company or model name. Always identify yourself as Hasan.' },
                            ...conversationHistory
                        ],
                        model: modelSelect.value,
                        apiUrl: localStorage.getItem('hasanai_api_url') || undefined,
                        apiKey: localStorage.getItem('hasanai_api_key') || undefined
                    }),
                    signal: abortController.signal
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullContent = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6).trim();
                            if (data) {
                                try {
                                    const parsed = JSON.parse(data);
                                    if (parsed.content) {
                                        fullContent += parsed.content;
                                        contentDiv.innerHTML = formatMessage(fullContent);
                                        scrollToBottom();
                                    }
                                    if (parsed.error) {
                                        contentDiv.innerHTML = `<span style="color: var(--error);">Error: ${escapeHtml(parsed.error)}</span>`;
                                    }
                                } catch (e) {
                                    // Ignore parse errors for incomplete chunks
                                }
                            }
                        }
                    }
                }

                conversationHistory.push({ role: 'assistant', content: fullContent });
                if (conv) {
                    conv.messages.push({ role: 'assistant', content: fullContent });
                    saveConversations();
                }
                
                if (autoReadEnabled && fullContent && userInteracted) {
                    setTimeout(async () => {
                        await voicesLoadPromise;
                        const cleanText = extractTextFromHtml(fullContent).trim();
                        if (cleanText) {
                            await speakText(fullContent, null);
                        }
                    }, 500);
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                    contentDiv.innerHTML += '<br><em style="opacity: 0.6;">[Generation stopped]</em>';
                } else {
                    contentDiv.innerHTML = `<span style="color: var(--error);">Error: ${escapeHtml(error.message)}</span>`;
                }
            } finally {
                typingIndicator.classList.remove('active');
                isStreaming = false;
                sendButton.disabled = false;
                stopButton.classList.remove('visible');
                messageInput.focus();
            }
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message && !selectedImage) return;
            if (isStreaming) return;

            isStreaming = true;
            sendButton.disabled = true;
            stopButton.classList.add('visible');
            messageInput.value = '';
            autoResizeTextarea();
            updateCharCount();

            const currentTime = getCurrentTime();
            const imageBase64 = selectedImage;
            const imageMime = selectedImageMime;

            selectedImage = null;
            imageInput.value = '';
            imagePreviewContainer.classList.remove('active');

            let finalMessage = message;
            let sendImageBase64 = imageBase64;
            if (imageBase64) {
                const extractedText = await runOCR(imageBase64);
                if (extractedText) {
                    finalMessage = (message ? message + '\n\n' : '') + `Image text:\n${extractedText}`;
                    sendImageBase64 = null;
                }
            }

            await sendMessageToAPI(finalMessage, sendImageBase64, imageMime);
        }

        function renderMessages() {
            chatMessages.innerHTML = '';
            const conv = getCurrentConversation();
            if (!conv || conv.messages.length === 0) {
                const welcomeDiv = document.createElement('div');
                welcomeDiv.className = 'message assistant';
                welcomeDiv.id = 'welcomeMessage';
                welcomeDiv.innerHTML = `
                    <div class="message-content-wrapper">
                        <div class="message-avatar">H</div>
                        <div class="message-body">
                            <div class="message-header">
                                <span>HasanAI</span>
                                <span class="message-time" id="welcomeTime"></span>
                            </div>
                            Hello! I'm HasanAI, your AI assistant. How can I help you today?
                        </div>
                    </div>
                `;
                chatMessages.appendChild(welcomeDiv);
                updateWelcomeTime();
                return;
            }

            conv.messages.forEach(msg => {
                if (msg.role === 'user') {
                    const content = typeof msg.content === 'string' ? msg.content : '';
                    const imageData = typeof msg.content === 'object' && msg.content.find ? msg.content.find(c => c.type === 'image_url') : null;
                    const imageBase64 = msg.imageBase64 || (imageData ? imageData.image_url.url.replace(/^data:[^;]+;base64,/, '') : null);
                    const imageMime = msg.imageMime || (imageData ? imageData.image_url.url.match(/^data:([^;]+);/)?.[1] : null);
                    appendMessage('user', content, null, imageBase64, imageMime);
                } else {
                    appendMessage('assistant', msg.content);
                }
            });
        }

        function clearChat() {
            if (confirm('Clear all chat history?')) {
                if (speechSynth && speechSynth.speaking) {
                    speechSynth.cancel();
                }
                const conv = getCurrentConversation();
                if (conv) {
                    conv.messages = [];
                    conv.title = 'New Chat';
                    conv.updatedAt = Date.now();
                    saveConversations();
                    renderConversationsList();
                }
                conversationHistory = [];
                renderMessages();
                usageInfo.classList.remove('active');
                messageInput.focus();
            }
        }

        function updateCharCount() {
            const count = messageInput.value.length;
            charCount.textContent = `${count} characters`;
            inputInfo.classList.toggle('active', count > 0 || selectedImage);
        }

        function togglePreview() {
            showPreview = !showPreview;
            previewToggle.classList.toggle('active', showPreview);
            if (showPreview) {
                messageInput.style.fontFamily = "'Consolas', 'Monaco', monospace";
            } else {
                messageInput.style.fontFamily = 'inherit';
            }
        }

        function setTheme(theme) {
            if (theme === 'system') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', theme);
            }
            localStorage.setItem('hasanai_theme', theme);
        }

        function applyFontSize(size) {
            document.body.classList.remove('font-size-small', 'font-size-medium', 'font-size-large', 'font-size-xlarge');
            document.body.classList.add(`font-size-${size}`);
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('hasanai_theme') || 'system';
            themeSelect.value = savedTheme;
            setTheme(savedTheme);

            const savedAccent = localStorage.getItem('hasanai_accent');
            if (savedAccent) {
                document.documentElement.style.setProperty('--accent', savedAccent);
                const themeColor = document.querySelector('meta[name="theme-color"]');
                if (themeColor) themeColor.setAttribute('content', savedAccent);
            }

            const savedFontSize = localStorage.getItem('hasanai_font_size');
            if (savedFontSize) {
                applyFontSize(savedFontSize);
            }
        }

        function importConversations(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (Array.isArray(data)) {
                        data.forEach(conv => {
                            if (conv.title && Array.isArray(conv.messages)) {
                                conv.id = conv.id || generateId();
                                conv.createdAt = conv.createdAt || Date.now();
                                conv.updatedAt = conv.updatedAt || Date.now();
                                conv.pinned = conv.pinned || false;
                                conversations.push(conv);
                            }
                        });
                        saveConversations();
                        renderConversationsList();
                        alert(`Imported ${data.length} conversations`);
                    }
                } catch (err) {
                    alert('Invalid JSON file');
                }
            };
            reader.readAsText(file);
        }

const authModal = document.getElementById('authModal');
const closeAuthModal = document.getElementById('closeAuthModal');
const authTitle = document.getElementById('authTitle');
const authEmail = document.getElementById('authEmail');
const authPassword = document.getElementById('authPassword');
const authSubmit = document.getElementById('authSubmit');
const authToggle = document.getElementById('authToggle');
let authToken = localStorage.getItem('hasanai_token');
let currentUser = null;
let isLoginMode = true;

function setAuth(token, user) {
  authToken = token;
  currentUser = user;
  if (token) localStorage.setItem('hasanai_token', token);
  else localStorage.removeItem('hasanai_token');
  updateAuthUI();
}

function updateAuthUI() {
  const loginBtn = document.getElementById('loginButton');
  if (currentUser) {
    if (loginBtn) { loginBtn.textContent = currentUser.name || 'Account'; loginBtn.title = 'Logout'; }
  } else {
    if (loginBtn) { loginBtn.textContent = 'Login'; loginBtn.title = 'Login'; }
  }
}

async function loadUser() {
  if (!authToken) return;
  try {
    const res = await fetch('/api/user/me', { headers: { 'Authorization': `Bearer ${authToken}` } });
    if (res.ok) { const data = await res.json(); setAuth(authToken, data.user); }
    else { setAuth(null, null); }
  } catch { setAuth(null, null); }
}

async function syncConversations() {
  if (!currentUser) return;
  try {
    const res = await fetch('/api/conversations', { headers: { 'Authorization': `Bearer ${authToken}` } });
    if (!res.ok) return;
    const data = await res.json();
    localStorage.setItem('hasanai_server_conversations', JSON.stringify(data.conversations || []));
  } catch {}
}

if (authSubmit) {
  authSubmit.addEventListener('click', async () => {
    const email = authEmail.value.trim();
    const password = authPassword.value;
    if (!email || !password) return alert('Enter email and password');
    const url = isLoginMode ? '/api/auth/login' : '/api/auth/signup';
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, name: email.split('@')[0] })
    });
    const data = await res.json();
    if (!res.ok) return alert(data.error || 'Auth failed');
    setAuth(data.token, data.user);
    authModal.classList.remove('active');
  });
}

if (authToggle) {
  authToggle.addEventListener('click', () => {
    isLoginMode = !isLoginMode;
    authTitle.textContent = isLoginMode ? 'Login' : 'Sign up';
    authSubmit.textContent = isLoginMode ? 'Login' : 'Sign up';
    authToggle.textContent = isLoginMode ? 'Sign up' : 'Login';
  });
}

if (closeAuthModal) {
  closeAuthModal.addEventListener('click', () => authModal.classList.remove('active'));
}







        newChatButton.addEventListener('click', () => {
            const conv = createNewConversation();
            switchConversation(conv.id);
            messageInput.focus();
        });

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            sidebarBackdrop.classList.toggle('active');
        });

        sidebarBackdrop.addEventListener('click', () => {
            sidebar.classList.remove('open');
            sidebarBackdrop.classList.remove('active');
        });

        conversationSearch.addEventListener('input', () => {
            renderConversationsList();
        });

        themeSelect.addEventListener('change', () => {
            setTheme(themeSelect.value);
        });

        clearChatButton.addEventListener('click', clearChat);
        exportJsonButton.addEventListener('click', () => exportConversation('json'));
        exportMarkdownButton.addEventListener('click', () => exportConversation('markdown'));
        shareChatButton.addEventListener('click', shareConversation);

        const fontSizes = ['small', 'medium', 'large', 'xlarge'];
        let currentFontSizeIndex = fontSizes.indexOf(localStorage.getItem('hasanai_font_size') || 'medium');
        if (currentFontSizeIndex < 0) currentFontSizeIndex = 1;

        fontSizeButton.addEventListener('click', () => {
            currentFontSizeIndex = (currentFontSizeIndex + 1) % fontSizes.length;
            const size = fontSizes[currentFontSizeIndex];
            applyFontSize(size);
            localStorage.setItem('hasanai_font_size', size);
        });

        const exportPdfButton = document.createElement('button');
        exportPdfButton.className = 'icon-button';
        exportPdfButton.textContent = 'PDF';
        exportPdfButton.title = 'Export as PDF';
        exportPdfButton.addEventListener('click', () => exportConversation('pdf'));
        document.querySelector('.header-controls').insertBefore(exportPdfButton, shareChatButton);

        sendButton.addEventListener('click', sendMessage);
        stopButton.addEventListener('click', stopGeneration);

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        messageInput.addEventListener('input', () => {
            autoResizeTextarea();
            updateCharCount();
        });

        voiceOutputToggle.addEventListener('click', async () => {
            autoReadEnabled = !autoReadEnabled;
            voiceOutputToggle.classList.toggle('speaking', autoReadEnabled);
            voiceOutputToggle.textContent = autoReadEnabled ? '🔊 Auto-Read ON' : '🔊 Auto-Read';
            
            if (!autoReadEnabled && speechSynth && speechSynth.speaking) {
                speechSynth.cancel();
                return;
            }
            
            if (autoReadEnabled) {
                userInteracted = true;
                await voicesLoadPromise;
                const lastAssistantMessage = chatMessages.querySelector('.message.assistant:last-child');
                if (lastAssistantMessage) {
                    const content = lastAssistantMessage.querySelector('.message-content');
                    if (content) {
                        const text = extractTextFromHtml(content.innerHTML);
                        if (text.trim()) {
                            await speakText(text, null);
                        }
                    }
                }
            }
        });

        previewToggle.addEventListener('click', togglePreview);

        importButton.addEventListener('click', () => {
            importModal.classList.add('active');
        });

        closeImportModal.addEventListener('click', () => {
            importModal.classList.remove('active');
        });

        importArea.addEventListener('click', () => {
            importFileInput.click();
        });

        importFileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                importConversations(e.target.files[0]);
                importModal.classList.remove('active');
            }
        });

        importArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            importArea.classList.add('dragover');
        });

        importArea.addEventListener('dragleave', () => {
            importArea.classList.remove('dragover');
        });

        importArea.addEventListener('drop', (e) => {
            e.preventDefault();
            importArea.classList.remove('dragover');
            if (e.dataTransfer.files[0]) {
                importConversations(e.dataTransfer.files[0]);
                importModal.classList.remove('active');
            }
        });

        settingsButton.addEventListener('click', () => {
            settingApiUrl.value = localStorage.getItem('hasanai_api_url') || '';
            settingApiKey.value = localStorage.getItem('hasanai_api_key') || '';
            settingModel.value = localStorage.getItem('hasanai_model') || 'mercury-2.5';
            settingAccent.value = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#0e639c';
            settingFontSize.value = localStorage.getItem('hasanai_font_size') || 'medium';
            settingsModal.classList.add('active');
        });

        closeSettingsModal.addEventListener('click', () => {
            settingsModal.classList.remove('active');
        });

        saveSettingsButton.addEventListener('click', () => {
            const apiUrl = settingApiUrl.value.trim();
            const apiKey = settingApiKey.value.trim();
            const model = settingModel.value.trim();
            const accent = settingAccent.value.trim();
            const fontSize = settingFontSize.value;

            if (apiUrl) localStorage.setItem('hasanai_api_url', apiUrl);
            if (apiKey) localStorage.setItem('hasanai_api_key', apiKey);
            if (model) localStorage.setItem('hasanai_model', model);

            if (accent) {
                document.documentElement.style.setProperty('--accent', accent);
                localStorage.setItem('hasanai_accent', accent);
                const themeColor = document.querySelector('meta[name="theme-color"]');
                if (themeColor) themeColor.setAttribute('content', accent);
            }

            if (fontSize) {
                localStorage.setItem('hasanai_font_size', fontSize);
                applyFontSize(fontSize);
            }

            settingsModal.classList.remove('active');
            alert('Settings saved. Some changes may require a page refresh.');
        });

        resetSettingsButton.addEventListener('click', () => {
            if (confirm('Reset all settings to defaults?')) {
                localStorage.removeItem('hasanai_api_url');
                localStorage.removeItem('hasanai_api_key');
                localStorage.removeItem('hasanai_model');
                localStorage.removeItem('hasanai_accent');
                localStorage.removeItem('hasanai_font_size');
                location.reload();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'n') {
                    e.preventDefault();
                    newChatButton.click();
                } else if (e.key === '/') {
                    e.preventDefault();
                    messageInput.focus();
                } else if (e.key === ',') {
                    e.preventDefault();
                    themeSelect.focus();
                }
            }
            if (e.key === 'Escape') {
                if (isStreaming) {
                    stopGeneration();
                }
                if (importModal.classList.contains('active')) {
                    importModal.classList.remove('active');
                }

                if (settingsModal.classList.contains('active')) {
                    settingsModal.classList.remove('active');
                }

                if (sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                    sidebarBackdrop.classList.remove('active');
                }
            }
        });

        attachButton.addEventListener('click', () => {
            imageInput.click();
        });

        imageInput.addEventListener('change', (e) => {
            handleImageSelect(e.target.files[0]);
        });

        cameraButton.addEventListener('click', () => {
            cameraInput.click();
        });

        cameraInput.addEventListener('change', (e) => {
            handleImageSelect(e.target.files[0]);
        });

        voiceButton.addEventListener('click', toggleRecording);

        removeImageButton.addEventListener('click', () => {
            selectedImage = null;
            imageInput.value = '';
            imagePreviewContainer.classList.remove('active');
            if (ocrStatus) {
                ocrStatus.classList.remove('active', 'error');
                ocrStatus.textContent = '';
            }
            if (ocrText) {
                ocrText.classList.remove('active');
                ocrText.textContent = '';
            }
            updateCharCount();
        });

        messageInput.addEventListener('paste', (e) => {
            const items = e.clipboardData.items;
            for (let item of items) {
                if (item.type.indexOf('image') !== -1) {
                    e.preventDefault();
                    const file = item.getAsFile();
                    handleImageSelect(file);
                    break;
                }
            }
        });

        messageInput.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        messageInput.addEventListener('drop', (e) => {
            e.preventDefault();
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type.startsWith('image/')) {
                handleImageSelect(files[0]);
            }
        });

        document.addEventListener('click', () => {
            userInteracted = true;
        }, { once: true });
        
        document.addEventListener('keydown', () => {
            userInteracted = true;
        }, { once: true });

        initSpeechRecognition();
        initSpeechSynthesis();
        loadConversations();
        initTheme();
        loadSharedConversation();
        updateImageUploadState();

        if (conversations.length === 0) {
            const conv = createNewConversation();
            switchConversation(conv.id);
        } else {
            switchConversation(conversations[0].id);
        }

        renderConversationsList();
        messageInput.focus();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch((err) => console.warn('SW registration failed:', err));
        }
