<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HasanAI - Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            max-height: 100vh;
            background-color: #252526;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            padding: 12px 20px;
            background-color: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            gap: 12px;
            flex-wrap: wrap;
        }

        .chat-header h1 {
            font-size: 18px;
            font-weight: 500;
            color: #d4d4d4;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .model-select {
            background-color: #3e3e42;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            min-width: 180px;
        }

        .model-select:focus {
            border-color: #0e639c;
        }

        .icon-button {
            background: transparent;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .icon-button:hover {
            background-color: #3e3e42;
            border-color: #0e639c;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background-color: #0e639c;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background-color: #3e3e42;
            color: #d4d4d4;
            border-bottom-left-radius: 4px;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            font-size: 11px;
            opacity: 0.7;
        }

        .message.user .message-header {
            color: #ffffff;
        }

        .message.assistant .message-header {
            color: #d4d4d4;
        }

        .message-time {
            font-size: 10px;
            opacity: 0.6;
        }

        .message-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            font-size: 10px;
            opacity: 0.6;
        }

        .message pre {
            background-color: #1e1e1e;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin-top: 8px;
            position: relative;
            border: 1px solid #3e3e42;
        }

        .message code {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .message p {
            margin-bottom: 8px;
        }

        .message p:last-child {
            margin-bottom: 0;
        }

        .message ul, .message ol {
            margin-left: 20px;
            margin-bottom: 8px;
        }

        .message li {
            margin-bottom: 4px;
        }

        .message strong {
            font-weight: 600;
        }

        .message em {
            font-style: italic;
        }

        .message-image {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            border: 1px solid #3e3e42;
        }

        .copy-button {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: #3e3e42;
            border: none;
            color: #d4d4d4;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message pre:hover .copy-button {
            opacity: 1;
        }

        .copy-button:hover {
            background-color: #0e639c;
            color: #ffffff;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 12px 16px;
            background-color: #3e3e42;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            color: #858585;
            font-style: italic;
            margin-left: 20px;
            margin-bottom: 8px;
        }

        .typing-indicator.active {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background-color: #858585;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .chat-input-container {
            padding: 12px 20px;
            background-color: #2d2d30;
            border-top: 1px solid #3e3e42;
            display: flex;
            gap: 8px;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            background-color: #3e3e42;
            border: 1px solid #3e3e42;
            border-radius: 8px;
            padding: 10px 14px;
            color: #d4d4d4;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 120px;
            line-height: 1.5;
        }

        .chat-input:focus {
            border-color: #0e639c;
        }

        .chat-input::placeholder {
            color: #858585;
        }

        .send-button {
            background-color: #0e639c;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            white-space: nowrap;
        }

        .send-button:hover:not(:disabled) {
            background-color: #1177bb;
            transform: translateY(-1px);
        }

        .send-button:active:not(:disabled) {
            background-color: #0a5a8f;
            transform: translateY(0);
        }

        .send-button:disabled {
            background-color: #3e3e42;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .voice-button {
            background: transparent;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .voice-button:hover {
            background-color: #3e3e42;
            border-color: #0e639c;
        }

        .voice-button.recording {
            background-color: #f48771;
            border-color: #f48771;
            color: #ffffff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .image-preview-container {
            padding: 12px 20px;
            background-color: #2d2d30;
            border-top: 1px solid #3e3e42;
            display: none;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
        }

        .image-preview-container.active {
            display: flex;
        }

        .image-preview {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #0e639c;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-preview .remove-image {
            position: absolute;
            top: 2px;
            right: 2px;
            background-color: rgba(0, 0, 0, 0.7);
            border: none;
            color: #ffffff;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-preview-info {
            flex: 1;
            font-size: 12px;
            color: #858585;
        }

        .attach-button {
            background: transparent;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .attach-button:hover {
            background-color: #3e3e42;
            border-color: #0e639c;
        }

        .camera-button {
            background: transparent;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .camera-button:hover {
            background-color: #3e3e42;
            border-color: #0e639c;
        }

        #imageInput, #cameraInput {
            display: none;
        }

        .voice-output-button {
            background: transparent;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
            white-space: nowrap;
        }

        .voice-output-button:hover {
            background-color: #3e3e42;
            border-color: #0e639c;
        }

        .voice-output-button.speaking {
            background-color: #0e639c;
            border-color: #0e639c;
            color: #ffffff;
        }

        .message-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message:hover .message-actions {
            opacity: 1;
        }

        .message-action-btn {
            background: transparent;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            transition: all 0.2s;
        }

        .message-action-btn:hover {
            background-color: #3e3e42;
            border-color: #0e639c;
        }

        .message-action-btn.active {
            background-color: #0e639c;
            border-color: #0e639c;
            color: #ffffff;
        }

        .usage-info {
            padding: 8px 20px;
            background-color: #2d2d30;
            border-top: 1px solid #3e3e42;
            font-size: 11px;
            color: #858585;
            display: none;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .usage-info.active {
            display: flex;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        ::-webkit-scrollbar-thumb {
            background: #3e3e42;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4e4e52;
        }

        @media (max-width: 768px) {
            .chat-container {
                max-width: 100%;
                height: 100vh;
                max-height: 100vh;
            }

            .message {
                max-width: 90%;
            }

            .chat-header h1 {
                font-size: 16px;
            }

            .header-controls {
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                HasanAI Chat
            </h1>
            <div class="header-controls">
                <select class="model-select" id="modelSelect" title="Select model">
                    <option value="openrouter/free">Free Model Router</option>
                </select>
                <button class="icon-button" id="exportJson" title="Export as JSON">JSON</button>
                <button class="icon-button" id="exportMarkdown" title="Export as Markdown">MD</button>
                <button class="icon-button" id="shareChat" title="Share conversation">Share</button>
                <button class="icon-button" id="clearChat" title="Clear chat">Clear</button>
                <button class="voice-output-button" id="voiceOutputToggle" title="Toggle auto-read">🔊 Auto-Read</button>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                <div class="message-header">
                    <span>HasanAI</span>
                    <span class="message-time" id="welcomeTime"></span>
                </div>
                Hello! I'm HasanAI, your AI assistant. How can I help you today?
            </div>
        </div>
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <span style="margin-left: 4px;">Thinking...</span>
        </div>
        <div class="image-preview-container" id="imagePreviewContainer">
            <div class="image-preview" id="imagePreview">
                <img id="previewImg" src="" alt="Preview">
                <button class="remove-image" id="removeImage">×</button>
            </div>
            <div class="image-preview-info">
                <div id="imageName">image.jpg</div>
                <div style="font-size: 10px; margin-top: 2px;">Ready to send</div>
            </div>
        </div>
        <div class="chat-input-container">
            <button class="attach-button" id="attachButton" title="Attach image">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
            </button>
            <input type="file" id="imageInput" accept="image/jpeg,image/png,image/gif,image/webp">
            <button class="camera-button" id="cameraButton" title="Take photo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                </svg>
            </button>
            <input type="file" id="cameraInput" accept="image/jpeg,image/png,image/gif,image/webp" capture="environment">
            <button class="voice-button" id="voiceButton" title="Voice input">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
            </button>
            <textarea
                class="chat-input"
                id="messageInput"
                placeholder="Type your message here... (Shift+Enter for new line)"
                rows="1"
            ></textarea>
            <button class="send-button" id="sendButton">Send</button>
        </div>
        <div class="usage-info" id="usageInfo">
            <span id="usageText"></span>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');
        const clearChatButton = document.getElementById('clearChat');
        const attachButton = document.getElementById('attachButton');
        const cameraButton = document.getElementById('cameraButton');
        const voiceButton = document.getElementById('voiceButton');
        const voiceOutputToggle = document.getElementById('voiceOutputToggle');
        const imageInput = document.getElementById('imageInput');
        const cameraInput = document.getElementById('cameraInput');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const previewImg = document.getElementById('previewImg');
        const imageName = document.getElementById('imageName');
        const removeImageButton = document.getElementById('removeImage');
        const modelSelect = document.getElementById('modelSelect');
        const exportJsonButton = document.getElementById('exportJson');
        const exportMarkdownButton = document.getElementById('exportMarkdown');
        const shareChatButton = document.getElementById('shareChat');
        const usageInfo = document.getElementById('usageInfo');
        const usageText = document.getElementById('usageText');

        let conversationHistory = [];
        let isStreaming = false;
        let selectedImage = null;
        let selectedImageMime = 'image/jpeg';
        let recognition = null;
        let isRecording = false;

        const FREE_MODELS = [
            { id: 'openrouter/free', name: 'Free Model Router' },
            { id: 'meta-llama/llama-3.1-8b-instruct:free', name: 'Llama 3.1 8B' },
            { id: 'meta-llama/llama-3.2-3b-instruct:free', name: 'Llama 3.2 3B' },
            { id: 'google/gemma-2-9b-it:free', name: 'Gemma 2 9B' },
            { id: 'nvidia/llama-3.1-nemotron-8b-instruct:free', name: 'Nemotron 8B' },
            { id: 'microsoft/phi-3-mini-128k-instruct:free', name: 'Phi-3 Mini' },
            { id: 'huggingfaceh4/zephyr-7b-beta:free', name: 'Zephyr 7B' },
            { id: 'mistralai/mistral-7b-instruct:free', name: 'Mistral 7B' }
        ];

        FREE_MODELS.forEach(model => {
            const option = document.createElement('option');
            option.value = model.id;
            option.textContent = model.name;
            modelSelect.appendChild(option);
        });

        function handleImageSelect(file) {
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert('Please select an image file');
                return;
            }

            selectedImageMime = file.type || 'image/jpeg';
            const reader = new FileReader();
            reader.onload = (event) => {
                selectedImage = event.target.result.split(',')[1];
                previewImg.src = event.target.result;
                imageName.textContent = file.name;
                imagePreviewContainer.classList.add('active');
            };
            reader.readAsDataURL(file);
        }

        function updateWelcomeTime() {
            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            const welcomeTimeEl = document.getElementById('welcomeTime');
            if (welcomeTimeEl) {
                welcomeTimeEl.textContent = time;
            }
        }
        updateWelcomeTime();

        function autoResizeTextarea() {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function getCurrentTime() {
            return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatMessage(text) {
            let formatted = escapeHtml(text);

            formatted = formatted.replace(/&gt;\n/g, '&gt;\n');

            formatted = formatted.replace(/```(\w+)?\n?([\s\S]*?)```/g, (match, lang, code) => {
                const escapedCode = code.trim().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return `<pre><code>${escapedCode}</code><button class="copy-button">Copy</button></pre>`;
            });

            formatted = formatted.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            formatted = formatted.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            formatted = formatted.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            formatted = formatted.replace(/^# (.+)$/gm, '<h1>$1</h1>');

            formatted = formatted.replace(/^\s*[-*] (.+)$/gm, '<li>$1</li>');
            formatted = formatted.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');

            formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');

            formatted = formatted.replace(/\n/g, '<br>');

            return formatted;
        }

        function copyCode(button) {
            const pre = button.parentElement;
            const code = pre.querySelector('code').textContent;
            navigator.clipboard.writeText(code).then(() => {
                const originalText = button.textContent;
                button.textContent = 'Copied!';
                button.style.backgroundColor = '#0e639c';
                button.style.color = '#ffffff';
                setTimeout(() => {
                    button.textContent = originalText;
                    button.style.backgroundColor = '';
                    button.style.color = '';
                }, 2000);
            });
        }

        let autoReadEnabled = false;
        let currentUtterance = null;
        let speechSynth = null;
        let voicesLoaded = false;
        let voicesLoadPromise = null;

        function initSpeechSynthesis() {
            if (!('speechSynthesis' in window)) {
                console.warn('Speech synthesis not supported');
                if (voiceOutputToggle) voiceOutputToggle.style.display = 'none';
                return;
            }

            speechSynth = window.speechSynthesis;
            voicesLoadPromise = new Promise((resolve) => {
                const finish = () => {
                    const voices = speechSynth.getVoices();
                    console.log('Voices loaded:', voices.length);
                    voicesLoaded = true;
                    resolve(voices);
                };

                const tryFinish = () => {
                    if (speechSynth.getVoices().length > 0) {
                        finish();
                    } else {
                        setTimeout(tryFinish, 200);
                    }
                };

                if (speechSynth.getVoices().length > 0) {
                    finish();
                } else {
                    speechSynth.onvoiceschanged = tryFinish;
                    setTimeout(tryFinish, 1000);
                }
            });
        }

        function extractTextFromHtml(html) {
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }

        async function speakText(text, buttonElement) {
            if (!speechSynth) {
                console.warn('Speech synthesis not supported');
                return;
            }

            try {
                await voicesLoadPromise;
            } catch (e) {
                console.warn('Voice loading failed', e);
            }

            if (!voicesLoaded) {
                console.warn('Voices not loaded yet');
                if (buttonElement) buttonElement.classList.remove('active');
                return;
            }

            if (speechSynth.speaking) {
                console.log('Stopping current speech');
                speechSynth.cancel();
                if (buttonElement) {
                    buttonElement.classList.remove('active');
                }
                await new Promise(resolve => setTimeout(resolve, 150));
            }

            const cleanText = extractTextFromHtml(text).trim();
            if (!cleanText) {
                console.warn('No text to speak');
                return;
            }

            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-US';
            utterance.rate = 1;
            utterance.pitch = 1;
            utterance.volume = 1;

            const voices = speechSynth.getVoices();
            const enVoices = voices.filter(voice => voice.lang.startsWith('en'));
            console.log('Speaking with', voices.length, 'voices,', enVoices.length, 'English');

            if (enVoices.length > 0) {
                const preferredVoice = enVoices.find(voice => 
                    voice.name.includes('Google') || voice.name.includes('Microsoft') || voice.name.includes('Apple')
                ) || enVoices[0];
                utterance.voice = preferredVoice;
                console.log('Using voice:', preferredVoice.name);
            }

            utterance.onstart = () => {
                console.log('Speech started');
                if (buttonElement) buttonElement.classList.add('active');
            };

            utterance.onend = () => {
                console.log('Speech ended');
                if (buttonElement) buttonElement.classList.remove('active');
                currentUtterance = null;
            };

            utterance.onerror = (event) => {
                console.error('Speech error:', event.error);
                if (buttonElement) buttonElement.classList.remove('active');
                currentUtterance = null;
            };

            console.log('Speaking:', cleanText.substring(0, 50) + '...');
            speechSynth.speak(utterance);
        }

        function addMessageActions(messageDiv, content) {
            const contentDiv = messageDiv.querySelector('.message-content');
            if (!contentDiv || contentDiv.querySelector('.message-actions')) {
                return;
            }

            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'message-actions';

            const speakBtn = document.createElement('button');
            speakBtn.className = 'message-action-btn';
            speakBtn.textContent = '🔊 Listen';
            speakBtn.addEventListener('click', () => {
                if (speechSynth && speechSynth.speaking) {
                    speechSynth.cancel();
                    speakBtn.classList.remove('active');
                } else {
                    speakText(content, speakBtn);
                }
            });

            actionsDiv.appendChild(speakBtn);
            contentDiv.appendChild(actionsDiv);
        }

        function appendMessage(role, content, time = null, imageBase64 = null, imageMime = null, meta = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const currentTime = time || getCurrentTime();
            const roleName = role === 'user' ? 'You' : 'HasanAI';
            
            let contentHtml = '';
            if (imageBase64) {
                const mime = imageMime || 'image/jpeg';
                contentHtml += `<img src="data:${mime};base64,${imageBase64}" class="message-image" alt="Uploaded image"><br>`;
            }
            if (content) {
                contentHtml += formatMessage(content);
            }
            
            let metaHtml = '';
            if (meta) {
                metaHtml = `<div class="message-meta"><span>${escapeHtml(meta)}</span></div>`;
            }
            
            messageDiv.innerHTML = `
                <div class="message-header">
                    <span>${roleName}</span>
                    <span class="message-time">${currentTime}</span>
                </div>
                <div class="message-content">${contentHtml}</div>
                ${metaHtml}
            `;
            
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
            
            if (role === 'assistant' && content) {
                addMessageActions(messageDiv, content);
            }
            
            return messageDiv;
        }

        function initSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                voiceButton.style.display = 'none';
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isRecording = true;
                voiceButton.classList.add('recording');
                messageInput.placeholder = 'Listening...';
            };

            recognition.onend = () => {
                isRecording = false;
                voiceButton.classList.remove('recording');
                messageInput.placeholder = 'Type your message here... (Shift+Enter for new line)';
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                messageInput.value = transcript;
                autoResizeTextarea();
                messageInput.focus();
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                isRecording = false;
                voiceButton.classList.remove('recording');
                messageInput.placeholder = 'Type your message here... (Shift+Enter for new line)';
                if (event.error === 'not-allowed') {
                    alert('Microphone access denied. Please allow microphone access to use voice input.');
                }
            };
        }

        function toggleRecording() {
            if (!recognition) return;

            if (isRecording) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function exportConversation(format) {
            if (conversationHistory.length === 0) {
                alert('No conversation to export');
                return;
            }

            let content, filename, type;

            if (format === 'json') {
                content = JSON.stringify(conversationHistory, null, 2);
                filename = 'hasanai-chat.json';
                type = 'application/json';
            } else {
                content = '# HasanAI Chat Export\n\n';
                content += `Exported: ${new Date().toLocaleString()}\n\n`;
                conversationHistory.forEach((msg, index) => {
                    const role = msg.role === 'user' ? 'You' : 'HasanAI';
                    content += `## ${role} (${index + 1})\n\n`;
                    if (typeof msg.content === 'string') {
                        content += `${msg.content}\n\n`;
                    } else {
                        msg.content.forEach(item => {
                            if (item.type === 'text') {
                                content += `${item.text}\n\n`;
                            } else if (item.type === 'image_url') {
                                content += '[Image]\n\n';
                            }
                        });
                    }
                });
                filename = 'hasanai-chat.md';
                type = 'text/markdown';
            }

            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function shareConversation() {
            if (conversationHistory.length === 0) {
                alert('No conversation to share');
                return;
            }

            try {
                const compressed = btoa(encodeURIComponent(JSON.stringify(conversationHistory)));
                const shareUrl = `${window.location.origin}${window.location.pathname}#chat=${compressed}`;
                
                navigator.clipboard.writeText(shareUrl).then(() => {
                    alert('Share link copied to clipboard!');
                }).catch(() => {
                    prompt('Copy this link:', shareUrl);
                });
            } catch (e) {
                alert('Failed to create share link');
            }
        }

        function loadSharedConversation() {
            const hash = window.location.hash;
            if (hash.startsWith('#chat=')) {
                try {
                    const compressed = hash.substring(6);
                    const json = decodeURIComponent(atob(compressed));
                    conversationHistory = JSON.parse(json);
                    
                    chatMessages.innerHTML = '';
                    conversationHistory.forEach(msg => {
                        if (msg.role === 'user') {
                            const content = typeof msg.content === 'string' ? msg.content : '';
                            const imageData = typeof msg.content === 'object' && msg.content.find ? msg.content.find(c => c.type === 'image_url') : null;
                            const imageBase64 = imageData ? imageData.image_url.url.replace(/^data:[^;]+;base64,/, '') : null;
                            const imageMime = imageData ? imageData.image_url.url.match(/^data:([^;]+);/)?.[1] : null;
                            appendMessage('user', content, null, imageBase64, imageMime);
                        } else {
                            const content = typeof msg.content === 'string' ? msg.content : '';
                            appendMessage('assistant', content);
                        }
                    });
                    
                    window.location.hash = '';
                    scrollToBottom();
                } catch (e) {
                    console.error('Failed to load shared conversation:', e);
                }
            }
        }

        chatMessages.addEventListener('click', (e) => {
            if (e.target.classList.contains('copy-button')) {
                const pre = e.target.closest('pre');
                const code = pre.querySelector('code').textContent;
                navigator.clipboard.writeText(code).then(() => {
                    const originalText = e.target.textContent;
                    e.target.textContent = 'Copied!';
                    e.target.style.backgroundColor = '#0e639c';
                    e.target.style.color = '#ffffff';
                    setTimeout(() => {
                        e.target.textContent = originalText;
                        e.target.style.backgroundColor = '';
                        e.target.style.color = '';
                    }, 2000);
                });
            }
        });

        initSpeechRecognition();
        initSpeechSynthesis();
        loadSharedConversation();

        window.testTTS = async (text) => {
            if (!text) {
                const lastAssistantMessage = chatMessages.querySelector('.message.assistant:last-child .message-content');
                if (lastAssistantMessage) {
                    text = extractTextFromHtml(lastAssistantMessage.innerHTML);
                }
            }
            if (text) {
                await speakText(text, null);
            }
        };

        attachButton.addEventListener('click', () => {
            imageInput.click();
        });

        imageInput.addEventListener('change', (e) => {
            handleImageSelect(e.target.files[0]);
        });

        cameraButton.addEventListener('click', () => {
            cameraInput.click();
        });

        cameraInput.addEventListener('change', (e) => {
            handleImageSelect(e.target.files[0]);
        });

        voiceButton.addEventListener('click', toggleRecording);

        removeImageButton.addEventListener('click', () => {
            selectedImage = null;
            imageInput.value = '';
            imagePreviewContainer.classList.remove('active');
        });

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message && !selectedImage) return;
            if (isStreaming) return;

            isStreaming = true;
            sendButton.disabled = true;
            messageInput.value = '';
            autoResizeTextarea();

            const currentTime = getCurrentTime();
            const userMessage = { role: 'user', content: [] };

            if (selectedImage) {
                userMessage.content.push({
                    type: 'image_url',
                    image_url: {
                        url: `data:${selectedImageMime};base64,${selectedImage}`
                    }
                });
            }

            if (message) {
                userMessage.content.push({
                    type: 'text',
                    text: message
                });
            }

            if (userMessage.content.length === 1 && userMessage.content[0].type === 'text') {
                userMessage.content = userMessage.content[0].text;
            }

            appendMessage('user', message, currentTime, selectedImage, selectedImageMime);
            conversationHistory.push(userMessage);

            const assistantMessageDiv = appendMessage('assistant', '', currentTime);
            const contentDiv = assistantMessageDiv.querySelector('.message-content');
            typingIndicator.classList.add('active');
            scrollToBottom();

            selectedImage = null;
            imageInput.value = '';
            imagePreviewContainer.classList.remove('active');

            let usageData = null;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        messages: conversationHistory,
                        model: modelSelect.value
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullContent = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6).trim();
                            if (data) {
                                try {
                                    const parsed = JSON.parse(data);
                                    if (parsed.content) {
                                        fullContent += parsed.content;
                                        contentDiv.innerHTML = formatMessage(fullContent);
                                        scrollToBottom();
                                    }
                                    if (parsed.error) {
                                        contentDiv.innerHTML = `<span style="color: #f48771;">Error: ${escapeHtml(parsed.error)}</span>`;
                                    }
                                    if (parsed.usage) {
                                        usageData = parsed.usage;
                                    }
                                } catch (e) {
                                    // Ignore parse errors for incomplete chunks
                                }
                            }
                        }
                    }
                }

                conversationHistory.push({ role: 'assistant', content: fullContent });

                if (autoReadEnabled && fullContent) {
                    (async () => {
                        await voicesLoadPromise;
                        await new Promise(resolve => setTimeout(resolve, 600));
                        const lastAssistantMessage = chatMessages.querySelector('.message.assistant:last-child');
                        if (!lastAssistantMessage) return;
                        const speakBtn = lastAssistantMessage.querySelector('.message-action-btn');
                        const content = lastAssistantMessage.querySelector('.message-content');
                        const cleanText = extractTextFromHtml(content ? content.innerHTML : '').trim();
                        if (cleanText && speakBtn) {
                            await speakText(fullContent, speakBtn);
                        }
                    })();
                }

                if (usageData) {
                    const promptTokens = usageData.prompt_tokens || 0;
                    const completionTokens = usageData.completion_tokens || 0;
                    const totalTokens = usageData.total_tokens || promptTokens + completionTokens;
                    usageText.textContent = `Tokens: ${promptTokens} prompt + ${completionTokens} completion = ${totalTokens} total`;
                    usageInfo.classList.add('active');
                }
            } catch (error) {
                contentDiv.innerHTML = `<span style="color: #f48771;">Error: ${escapeHtml(error.message)}</span>`;
            } finally {
                typingIndicator.classList.remove('active');
                isStreaming = false;
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        function clearChat() {
            if (confirm('Clear all chat history?')) {
                if (speechSynth && speechSynth.speaking) {
                    speechSynth.cancel();
                }
                conversationHistory = [];
                chatMessages.innerHTML = `
                    <div class="message assistant">
                        <div class="message-header">
                            <span>HasanAI</span>
                            <span class="message-time">${getCurrentTime()}</span>
                        </div>
                        Chat cleared. How can I help you today?
                    </div>
                `;
                usageInfo.classList.remove('active');
                messageInput.focus();
            }
        }

        voiceOutputToggle.addEventListener('click', async () => {
            autoReadEnabled = !autoReadEnabled;
            voiceOutputToggle.classList.toggle('speaking', autoReadEnabled);
            voiceOutputToggle.textContent = autoReadEnabled ? '🔊 Auto-Read ON' : '🔊 Auto-Read';
            
            if (!autoReadEnabled && speechSynth && speechSynth.speaking) {
                speechSynth.cancel();
                return;
            }
            
            if (autoReadEnabled) {
                await voicesLoadPromise;
                const lastAssistantMessage = chatMessages.querySelector('.message.assistant:last-child');
                if (lastAssistantMessage) {
                    const speakBtn = lastAssistantMessage.querySelector('.message-action-btn');
                    const content = lastAssistantMessage.querySelector('.message-content');
                    if (content && speakBtn) {
                        const text = extractTextFromHtml(content.innerHTML);
                        if (text.trim()) {
                            await speakText(text, speakBtn);
                        }
                    }
                }
            }
        });

        window.addEventListener('load', () => {
            if (speechSynth) {
                console.log('Page loaded, voices:', speechSynth.getVoices().length);
            }
        });

        clearChatButton.addEventListener('click', clearChat);
        exportJsonButton.addEventListener('click', () => exportConversation('json'));
        exportMarkdownButton.addEventListener('click', () => exportConversation('markdown'));
        shareChatButton.addEventListener('click', shareConversation);

        sendButton.addEventListener('click', sendMessage);

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        messageInput.addEventListener('input', autoResizeTextarea);

        messageInput.focus();
    </script>
</body>
</html>
