<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HasanAI - Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            max-height: 100vh;
            background-color: #252526;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            padding: 16px 20px;
            background-color: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .chat-header h1 {
            font-size: 18px;
            font-weight: 500;
            color: #d4d4d4;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-button {
            background: transparent;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .icon-button:hover {
            background-color: #3e3e42;
            border-color: #0e639c;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background-color: #0e639c;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background-color: #3e3e42;
            color: #d4d4d4;
            border-bottom-left-radius: 4px;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            font-size: 11px;
            opacity: 0.7;
        }

        .message.user .message-header {
            color: #ffffff;
        }

        .message.assistant .message-header {
            color: #d4d4d4;
        }

        .message-time {
            font-size: 10px;
            opacity: 0.6;
        }

        .message pre {
            background-color: #1e1e1e;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin-top: 8px;
            position: relative;
            border: 1px solid #3e3e42;
        }

        .message code {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .message p {
            margin-bottom: 8px;
        }

        .message p:last-child {
            margin-bottom: 0;
        }

        .message ul, .message ol {
            margin-left: 20px;
            margin-bottom: 8px;
        }

        .message li {
            margin-bottom: 4px;
        }

        .message strong {
            font-weight: 600;
        }

        .message em {
            font-style: italic;
        }

        .message-image {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            border: 1px solid #3e3e42;
        }

        .copy-button {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: #3e3e42;
            border: none;
            color: #d4d4d4;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message pre:hover .copy-button {
            opacity: 1;
        }

        .copy-button:hover {
            background-color: #0e639c;
            color: #ffffff;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 12px 16px;
            background-color: #3e3e42;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            color: #858585;
            font-style: italic;
            margin-left: 20px;
            margin-bottom: 8px;
        }

        .typing-indicator.active {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background-color: #858585;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .chat-input-container {
            padding: 16px 20px;
            background-color: #2d2d30;
            border-top: 1px solid #3e3e42;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            background-color: #3e3e42;
            border: 1px solid #3e3e42;
            border-radius: 8px;
            padding: 10px 14px;
            color: #d4d4d4;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 120px;
            line-height: 1.5;
        }

        .chat-input:focus {
            border-color: #0e639c;
        }

        .chat-input::placeholder {
            color: #858585;
        }

        .send-button {
            background-color: #0e639c;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            white-space: nowrap;
        }

        .send-button:hover:not(:disabled) {
            background-color: #1177bb;
            transform: translateY(-1px);
        }

        .send-button:active:not(:disabled) {
            background-color: #0a5a8f;
            transform: translateY(0);
        }

        .send-button:disabled {
            background-color: #3e3e42;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .image-preview-container {
            padding: 12px 20px;
            background-color: #2d2d30;
            border-top: 1px solid #3e3e42;
            display: none;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
        }

        .image-preview-container.active {
            display: flex;
        }

        .image-preview {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #0e639c;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-preview .remove-image {
            position: absolute;
            top: 2px;
            right: 2px;
            background-color: rgba(0, 0, 0, 0.7);
            border: none;
            color: #ffffff;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-preview-info {
            flex: 1;
            font-size: 12px;
            color: #858585;
        }

        .attach-button {
            background: transparent;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .attach-button:hover {
            background-color: #3e3e42;
            border-color: #0e639c;
        }

        #imageInput {
            display: none;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        ::-webkit-scrollbar-thumb {
            background: #3e3e42;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4e4e52;
        }

        @media (max-width: 768px) {
            .chat-container {
                max-width: 100%;
                height: 100vh;
                max-height: 100vh;
            }

            .message {
                max-width: 90%;
            }

            .chat-header h1 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                HasanAI Chat
            </h1>
            <div class="header-actions">
                <button class="icon-button" id="clearChat" title="Clear chat">Clear</button>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                <div class="message-header">
                    <span>HasanAI</span>
                    <span class="message-time" id="welcomeTime"></span>
                </div>
                Hello! I'm HasanAI, your AI assistant. How can I help you today?
            </div>
        </div>
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <span style="margin-left: 4px;">Thinking...</span>
        </div>
        <div class="image-preview-container" id="imagePreviewContainer">
            <div class="image-preview" id="imagePreview">
                <img id="previewImg" src="" alt="Preview">
                <button class="remove-image" id="removeImage">×</button>
            </div>
            <div class="image-preview-info">
                <div id="imageName">image.jpg</div>
                <div style="font-size: 10px; margin-top: 2px;">Ready to send</div>
            </div>
        </div>
        <div class="chat-input-container">
            <button class="attach-button" id="attachButton" title="Attach image">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
            </button>
            <input type="file" id="imageInput" accept="image/jpeg,image/png,image/gif,image/webp">
            <textarea
                class="chat-input"
                id="messageInput"
                placeholder="Type your message here... (Shift+Enter for new line)"
                rows="1"
            ></textarea>
            <button class="send-button" id="sendButton">Send</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');
        const clearChatButton = document.getElementById('clearChat');
        const attachButton = document.getElementById('attachButton');
        const imageInput = document.getElementById('imageInput');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const previewImg = document.getElementById('previewImg');
        const imageName = document.getElementById('imageName');
        const removeImageButton = document.getElementById('removeImage');

        let conversationHistory = [];
        let isStreaming = false;
        let selectedImage = null;
        let selectedImageMime = 'image/jpeg';

        function updateWelcomeTime() {
            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            const welcomeTimeEl = document.getElementById('welcomeTime');
            if (welcomeTimeEl) {
                welcomeTimeEl.textContent = time;
            }
        }
        updateWelcomeTime();

        function autoResizeTextarea() {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function getCurrentTime() {
            return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatMessage(text) {
            let formatted = escapeHtml(text);

            formatted = formatted.replace(/&gt;\n/g, '&gt;\n');

            formatted = formatted.replace(/```(\w+)?\n?([\s\S]*?)```/g, (match, lang, code) => {
                const escapedCode = code.trim().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return `<pre><code>${escapedCode}</code><button class="copy-button" onclick="copyCode(this)">Copy</button></pre>`;
            });

            formatted = formatted.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            formatted = formatted.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            formatted = formatted.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            formatted = formatted.replace(/^# (.+)$/gm, '<h1>$1</h1>');

            formatted = formatted.replace(/^\s*[-*] (.+)$/gm, '<li>$1</li>');
            formatted = formatted.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');

            formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');

            formatted = formatted.replace(/\n/g, '<br>');

            return formatted;
        }

        function copyCode(button) {
            const pre = button.parentElement;
            const code = pre.querySelector('code').textContent;
            navigator.clipboard.writeText(code).then(() => {
                const originalText = button.textContent;
                button.textContent = 'Copied!';
                button.style.backgroundColor = '#0e639c';
                button.style.color = '#ffffff';
                setTimeout(() => {
                    button.textContent = originalText;
                    button.style.backgroundColor = '';
                    button.style.color = '';
                }, 2000);
            });
        }

        function appendMessage(role, content, time = null, imageBase64 = null, imageMime = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const currentTime = time || getCurrentTime();
            const roleName = role === 'user' ? 'You' : 'HasanAI';
            
            let contentHtml = '';
            if (imageBase64) {
                const mime = imageMime || 'image/jpeg';
                contentHtml += `<img src="data:${mime};base64,${imageBase64}" class="message-image" alt="Uploaded image"><br>`;
            }
            if (content) {
                contentHtml += formatMessage(content);
            }
            
            messageDiv.innerHTML = `
                <div class="message-header">
                    <span>${roleName}</span>
                    <span class="message-time">${currentTime}</span>
                </div>
                <div class="message-content">${contentHtml}</div>
            `;
            
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
            return messageDiv;
        }

        attachButton.addEventListener('click', () => {
            imageInput.click();
        });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert('Please select an image file');
                return;
            }

            selectedImageMime = file.type || 'image/jpeg';
            const reader = new FileReader();
            reader.onload = (event) => {
                selectedImage = event.target.result.split(',')[1];
                previewImg.src = event.target.result;
                imageName.textContent = file.name;
                imagePreviewContainer.classList.add('active');
            };
            reader.readAsDataURL(file);
        });

        removeImageButton.addEventListener('click', () => {
            selectedImage = null;
            imageInput.value = '';
            imagePreviewContainer.classList.remove('active');
        });

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message && !selectedImage) return;
            if (isStreaming) return;

            isStreaming = true;
            sendButton.disabled = true;
            messageInput.value = '';
            autoResizeTextarea();

            const currentTime = getCurrentTime();
            const userMessage = { role: 'user', content: [] };

            if (selectedImage) {
                userMessage.content.push({
                    type: 'image_url',
                    image_url: {
                        url: `data:${selectedImageMime};base64,${selectedImage}`
                    }
                });
            }

            if (message) {
                userMessage.content.push({
                    type: 'text',
                    text: message
                });
            }

            if (userMessage.content.length === 1 && userMessage.content[0].type === 'text') {
                userMessage.content = userMessage.content[0].text;
            }

            appendMessage('user', message, currentTime, selectedImage, selectedImageMime);
            conversationHistory.push(userMessage);

            const assistantMessageDiv = appendMessage('assistant', '', currentTime);
            const contentDiv = assistantMessageDiv.querySelector('.message-content');
            typingIndicator.classList.add('active');
            scrollToBottom();

            selectedImage = null;
            imageInput.value = '';
            imagePreviewContainer.classList.remove('active');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ messages: conversationHistory })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullContent = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6).trim();
                            if (data) {
                                try {
                                    const parsed = JSON.parse(data);
                                    if (parsed.content) {
                                        fullContent += parsed.content;
                                        contentDiv.innerHTML = formatMessage(fullContent);
                                        scrollToBottom();
                                    }
                                    if (parsed.error) {
                                        contentDiv.innerHTML = `<span style="color: #f48771;">Error: ${escapeHtml(parsed.error)}</span>`;
                                    }
                                } catch (e) {
                                    // Ignore parse errors for incomplete chunks
                                }
                            }
                        }
                    }
                }

                conversationHistory.push({ role: 'assistant', content: fullContent });
            } catch (error) {
                contentDiv.innerHTML = `<span style="color: #f48771;">Error: ${escapeHtml(error.message)}</span>`;
            } finally {
                typingIndicator.classList.remove('active');
                isStreaming = false;
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        function clearChat() {
            if (confirm('Clear all chat history?')) {
                conversationHistory = [];
                chatMessages.innerHTML = `
                    <div class="message assistant">
                        <div class="message-header">
                            <span>HasanAI</span>
                            <span class="message-time">${getCurrentTime()}</span>
                        </div>
                        Chat cleared. How can I help you today?
                    </div>
                `;
                messageInput.focus();
            }
        }

        clearChatButton.addEventListener('click', clearChat);

        sendButton.addEventListener('click', sendMessage);

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        messageInput.addEventListener('input', autoResizeTextarea);

        messageInput.focus();
    </script>
</body>
</html>
