<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HasanAI - Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background-color: #252526;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .chat-header {
            padding: 16px 20px;
            background-color: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            border-radius: 8px 8px 0 0;
        }

        .chat-header h1 {
            font-size: 18px;
            font-weight: 500;
            color: #d4d4d4;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: #0e639c;
            color: #ffffff;
        }

        .message.assistant {
            align-self: flex-start;
            background-color: #3e3e42;
            color: #d4d4d4;
        }

        .message pre {
            background-color: #1e1e1e;
            padding: 12px;
            border-radius: 4px;
            overflow-x: auto;
            margin-top: 8px;
        }

        .message code {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
        }

        .chat-input-container {
            padding: 16px 20px;
            background-color: #2d2d30;
            border-top: 1px solid #3e3e42;
            border-radius: 0 0 8px 8px;
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            background-color: #3e3e42;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 10px 14px;
            color: #d4d4d4;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 120px;
        }

        .chat-input:focus {
            border-color: #0e639c;
        }

        .chat-input::placeholder {
            color: #858585;
        }

        .send-button {
            background-color: #0e639c;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .send-button:hover {
            background-color: #1177bb;
        }

        .send-button:active {
            background-color: #0a5a8f;
        }

        .send-button:disabled {
            background-color: #3e3e42;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 12px 16px;
            background-color: #3e3e42;
            border-radius: 8px;
            color: #858585;
            font-style: italic;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        ::-webkit-scrollbar-thumb {
            background: #3e3e42;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4e4e52;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>HasanAI Chat</h1>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                Hello! I'm HasanAI. How can I help you today?
            </div>
        </div>
        <div class="typing-indicator" id="typingIndicator">Thinking...</div>
        <div class="chat-input-container">
            <textarea
                class="chat-input"
                id="messageInput"
                placeholder="Type your message here..."
                rows="1"
            ></textarea>
            <button class="send-button" id="sendButton">Send</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');

        let conversationHistory = [
            { role: 'assistant', content: 'Hello! I\'m HasanAI. How can I help you today?' }
        ];
        let isStreaming = false;

        function autoResizeTextarea() {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function formatMessage(text) {
            const codeBlockRegex = /```([\s\S]*?)```/g;
            let formatted = text.replace(codeBlockRegex, (match, code) => {
                const escapedCode = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return `<pre><code>${escapedCode.trim()}</code></pre>`;
            });

            const inlineCodeRegex = /`([^`]+)`/g;
            formatted = formatted.replace(inlineCodeRegex, '<code>$1</code>');

            return formatted;
        }

        function appendMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = formatMessage(content);
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
            return messageDiv;
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isStreaming) return;

            isStreaming = true;
            sendButton.disabled = true;
            messageInput.value = '';
            autoResizeTextarea();

            appendMessage('user', message);
            conversationHistory.push({ role: 'user', content: message });

            const assistantMessageDiv = appendMessage('assistant', '');
            typingIndicator.style.display = 'block';
            scrollToBottom();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ messages: conversationHistory })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullContent = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6).trim();
                            if (data) {
                                try {
                                    const parsed = JSON.parse(data);
                                    if (parsed.content) {
                                        fullContent += parsed.content;
                                        assistantMessageDiv.innerHTML = formatMessage(fullContent);
                                        scrollToBottom();
                                    }
                                    if (parsed.error) {
                                        assistantMessageDiv.innerHTML = `<span style="color: #f48771;">Error: ${parsed.error}</span>`;
                                    }
                                } catch (e) {
                                    // Ignore parse errors for incomplete chunks
                                }
                            }
                        }
                    }
                }

                conversationHistory.push({ role: 'assistant', content: fullContent });
            } catch (error) {
                assistantMessageDiv.innerHTML = `<span style="color: #f48771;">Error: ${error.message}</span>`;
            } finally {
                typingIndicator.style.display = 'none';
                isStreaming = false;
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        sendButton.addEventListener('click', sendMessage);

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        messageInput.addEventListener('input', autoResizeTextarea);

        messageInput.focus();
    </script>
</body>
</html>
